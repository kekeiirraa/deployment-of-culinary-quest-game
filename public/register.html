<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Culinary Adventure Quest</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">
  <main class="auth-card">
    <h1>Register</h1>
    <p class="subtitle">Create an account to join the wellness challenges.</p>

    <div id="message" class="message hidden" role="alert"></div>

    <form id="register-form" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username"
          placeholder="3-20 characters, letters, numbers, underscores">
        <span id="username-error" class="field-error hidden"></span>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="your@email.com">
        <span id="email-error" class="field-error hidden"></span>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="new-password"
          placeholder="Min 8 chars, uppercase, lowercase, number, special">
        <div id="password-strength" class="password-strength hidden"></div>
        <span id="password-error" class="field-error hidden"></span>
      </div>
      <div class="password-requirements">
        <p>Password must contain:</p>
        <ul>
          <li>At least 8 characters</li>
          <li>One uppercase letter (A-Z)</li>
          <li>One lowercase letter (a-z)</li>
          <li>One number (0-9)</li>
          <li>One special character (!@#$%^&* etc.)</li>
        </ul>
      </div>
      <button type="submit">Register</button>
    </form>

    <p class="links">
      Already have an account? <a href="login.html">Log in</a><br> 
      <a href="index.html">Back to home</a>
    </p>
  </main>
  <script src="js/app.js"></script>
  <script>
    initRegisterForm();
  </script>
</body>

</html>
